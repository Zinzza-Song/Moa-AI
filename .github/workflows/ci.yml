name: MoaAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: moaai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Run Gradle Test
        working-directory: backend
        env:
          DB_NAME: moaai
          DB_USERNAME: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci-test-jwt-secret-key-must-be-at-least-32-bytes-long
          GEMINI_API_KEY: test-gemini-key
          YOUTUBE_API_KEY: test-youtube-key
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret
          KAKAO_CLIENT_ID: test-kakao-id
          KAKAO_CLIENT_SECRET: test-kakao-secret
          NAVER_CLIENT_ID: test-naver-id
          NAVER_CLIENT_SECRET: test-naver-secret
        run: ./gradlew test --no-daemon

  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build